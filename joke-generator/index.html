<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="joke-card">
            <h1>😂 Joke Generator</h1>
            <div id="jokeDisplay" class="joke-display">
                <p>Click the button to get a random joke!</p>
            </div>
            <button id="jokeBtn" class="btn">Get a Joke</button>
            <button id="copyBtn" class="btn btn-secondary">Copy Joke</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
